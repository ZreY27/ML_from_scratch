<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA ESGI - Prédiction d'images</title>
</head>
<body style="font-family: sans-serif; max-width: 640px; margin: 2em auto; padding: 0 1em;">
    <h1>Prédiction d'images par IA</h1>

    {% if not models %}
        <p><strong>Aucun modèle trouvé dans <code>models/</code>.</strong></p>
        <p>Lance un entraînement (ex. <code>python scripts/train_test_mlp_classification.py</code>)
           pour générer un modèle + son manifeste, puis recharge cette page.</p>
    {% else %}
        <form id="form">
            <p>
                <label>Modèle :
                    <select id="model_id" name="model_id">
                        {% for m in models %}
                        <option value="{{ m.id }}">{{ m.name }} ({{ m.type }})</option>
                        {% endfor %}
                    </select>
                </label>
            </p>
            <p>
                <label>Version :
                    <select id="version" name="version"></select>
                </label>
            </p>
            <p>
                <label>Image : <input type="file" id="file" name="file" accept="image/*" required></label>
            </p>
            <p><img id="preview" alt="" style="max-height: 200px; display: none; border: 1px solid #ccc;"></p>
            <button type="submit">Analyser l'image</button>
        </form>

        <h2 id="result"></h2>

        <script>
            // Données injectées par le serveur : [{id, name, type, versions:[{version, created, width, height}]}]
            const MODELS = {{ models | tojson }};
            const modelSel = document.getElementById('model_id');
            const versionSel = document.getElementById('version');

            // Remplit le sélecteur de version selon le modèle choisi
            function fillVersions() {
                const m = MODELS.find(x => x.id === modelSel.value);
                versionSel.innerHTML = '';
                (m ? m.versions : []).forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.version;
                    const date = v.created ? ' (' + v.created + ')' : '';
                    opt.textContent = 'v' + v.version + date + ' — ' + v.width + 'x' + v.height;
                    versionSel.appendChild(opt);
                });
            }
            modelSel.addEventListener('change', fillVersions);
            fillVersions();

            // Aperçu de l'image choisie
            const fileInput = document.getElementById('file');
            const preview = document.getElementById('preview');
            fileInput.addEventListener('change', e => {
                const f = e.target.files[0];
                if (f) {
                    preview.src = URL.createObjectURL(f);
                    preview.style.display = 'inline';
                }
            });

            // Envoi et affichage du résultat
            document.getElementById('form').addEventListener('submit', async e => {
                e.preventDefault();
                const result = document.getElementById('result');
                result.textContent = 'Calcul en cours...';
                const resp = await fetch('/predict', { method: 'POST', body: new FormData(e.target) });
                const data = await resp.json();
                result.textContent = data.error
                    ? 'Erreur : ' + data.error
                    : 'Prédiction : ' + data.prediction + '  [' + data.model + ' v' + data.version + ']';
            });
        </script>
    {% endif %}
</body>
</html>
